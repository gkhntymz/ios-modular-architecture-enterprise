name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spm-tests:
    name: SPM tests
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Xcode version
        run: xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run CoreNetworking tests
        run: swift test --package-path Packages/CoreNetworking

      - name: Run CoreLogging tests
        run: swift test --package-path Packages/CoreLogging

      - name: Run FeatureAuthentication tests
        run: swift test --package-path Packages/FeatureAuthentication

  app-build:
    name: App build
    runs-on: macos-15
    timeout-minutes: 10
    needs: spm-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Select available iOS Simulator
        id: sim
        run: |
          python3 - << 'PY'
          import json, subprocess, sys, os

          out = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True
          )
          data = json.loads(out)

          devices = []
          for runtime, devs in data.get("devices", {}).items():
              for d in devs:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      devices.append(d)

          if not devices:
              print("No available iPhone simulator found")
              sys.exit(1)

          device = devices[0]
          print(f"Selected simulator: {device['name']} ({device['udid']})")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"udid={device['udid']}\n")
          PY

      - name: Build App (no tests)
        run: |
          set -o pipefail
          xcodebuild build \
            -project EnterpriseApp.xcodeproj \
            -scheme EnterpriseApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
          | xcbeautify

  app-tests:
    name: App tests
    runs-on: macos-15
    timeout-minutes: 15
    needs: app-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Select available iOS Simulator
        id: sim
        run: |
          python3 - << 'PY'
          import json, subprocess, sys, os

          out = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True
          )
          data = json.loads(out)

          devices = []
          for runtime, devs in data.get("devices", {}).items():
              for d in devs:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      devices.append(d)

          if not devices:
              print("No available iPhone simulator found")
              sys.exit(1)

          device = devices[0]
          print(f"Selected simulator: {device['name']} ({device['udid']})")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"udid={device['udid']}\n")
          PY

      - name: Run App tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project EnterpriseApp.xcodeproj \
            -scheme EnterpriseApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
          | xcbeautify